# Use the original request URI: SPA fallback internally changes $uri to /index.html.
map $request_uri $index_policy {
    default "noindex, nofollow";
    ~^/(\?.*)?$ "index, follow";
}
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    autoindex off;
    client_max_body_size 128k;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    add_header Permissions-Policy 'camera=(), microphone=(), geolocation=()' always;
    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Cross-Origin-Embedder-Policy require-corp always;
    add_header Cross-Origin-Resource-Policy same-origin always;
    add_header Cache-Control 'no-store' always;
    add_header X-Robots-Tag $index_policy always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; style-src-attr 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    # HSTS must be added at the actual HTTPS ingress, not to local HTTP.
    location ~ /\. { deny all; }
    location ~* \.(map|env|bak|sql|log)$ { return 404; }
    location /api/ {
        proxy_pass http://server:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 65s;
    }
    location /actuator/ { return 404; }
    location / { try_files $uri $uri/ /index.html; }
}
