spring.application.name=trustforge
server.port=${PORT:8080}
server.forward-headers-strategy=none
server.error.include-message=never
server.error.include-stacktrace=never
server.tomcat.max-http-form-post-size=256KB
server.tomcat.max-swallow-size=256KB
server.servlet.session.timeout=30m
server.servlet.session.cookie.name=TFSESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${APP_SECURE_COOKIES:false}
server.servlet.session.cookie.same-site=lax
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/trustforge}
spring.datasource.username=${DB_USERNAME:trustforge}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=5000
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=${REDIS_TLS:false}
spring.data.redis.timeout=2s
spring.data.redis.connect-timeout=2s
spring.session.data.redis.namespace=tf:session
spring.session.data.redis.repository-type=indexed
spring.session.data.redis.flush-mode=immediate
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:1025}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_TLS:false}
spring.mail.properties.mail.smtp.starttls.required=${SMTP_TLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.health.mail.enabled=false
logging.structured.format.console=ecs
trustforge.public-url=${APP_BASE_URL:http://localhost:5173}
trustforge.mail.from=${SMTP_FROM:trustforge@localhost}
trustforge.production=${PRODUCTION:false}
trustforge.cache.host=${CACHE_REDIS_HOST:localhost}
trustforge.cache.port=${CACHE_REDIS_PORT:6380}
trustforge.cache.password=${CACHE_REDIS_PASSWORD:}
trustforge.cache.tls=${CACHE_REDIS_TLS:false}

# Do not inherit a host DEBUG environment flag or log request DTO contents.
debug=false
trace=false
logging.level.root=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.jdbc=INFO
logging.level.org.hibernate.SQL=WARN

trustforge.ai.api-key=${BHARATCODE_API_KEY:}
trustforge.ai.base-url=${BHARATCODE_BASE_URL:https://bharatcode.ai/api/model/v1}
trustforge.ai.model=${BHARATCODE_MODEL:qwen-3.8-27b}
trustforge.ai.timeout-seconds=${BHARATCODE_TIMEOUT:45}
trustforge.ai.daily-request-limit=${BHARATCODE_DAILY_REQUEST_LIMIT:200}

# Reject client-supplied fields outside explicit request contracts.
spring.jackson.deserialization.fail-on-unknown-properties=true
